spring:
  application:
    name: beauty-salon

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/beauty_salon
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  sql:
    init:
      mode: never

server:
  port: 8080

app:
  jwt:
    secret: "dab6650d-d423-42d6-81b1-8508fd650af2"
    expiration-ms: 86400000