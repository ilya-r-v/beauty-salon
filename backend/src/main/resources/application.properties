spring.application.name=beauty-salon-backend
server.port=8080

# Database JDBC configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/beauty_salon}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JWT configuration
jwt.secret=${JWT_SECRET:beauty-salon-secret-key-must-be-very-long-and-secure-32bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
